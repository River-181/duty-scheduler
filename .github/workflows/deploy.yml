name: Deploy to GitHub Pages

# main 에 push 하면 정적 빌드 후 GitHub Pages 로 배포한다.
# 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 설정해야 한다.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 배포 전 품질 게이트 — 린트와 단위 테스트를 통과해야 빌드/배포된다.
      - run: npm run lint
      - run: npm test
      # 프로젝트 사이트는 https://<user>.github.io/<repo>/ 에서 서비스되므로
      # basePath 를 저장소 이름으로 주입한다.
      - name: Build (static export)
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      # _next 폴더가 Jekyll 에 의해 무시되지 않도록 .nojekyll 추가
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
